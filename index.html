<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Lector QR — Asistencia</title>

<!-- ===== PWA ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lector QR">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    background: #0f172a;
    color: #e2e8f0;
  }

  h3 {
    text-align: center;
    font-size: 16px;
    margin: 0 0 14px;
  }

  #qr-reader {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    border: 4px solid transparent; /* base para el destello de captura */
    transition: border-color 0.05s ease-out;
  }

  /*
   * Destello visual INSTANTÁNEO al detectar el QR, antes de esperar la
   * respuesta del servidor. Mismo espíritu que beepCaptura(): feedback
   * inmediato de "sí te leí", sin depender de la latencia de red.
   */
  #qr-reader.destello-captura {
    border-color: #22c55e;
    box-shadow: 0 0 24px 4px rgba(34, 197, 94, 0.7);
  }

  /*
   * NUEVO — destello ámbar para el caso "duplicado / ya en vuelo": distinto
   * del verde (captura nueva) para que el auxiliar pueda diferenciar de un
   * vistazo por qué no hubo un beep de éxito normal.
   */
  #qr-reader.destello-duplicado {
    border-color: #f59e0b;
    box-shadow: 0 0 24px 4px rgba(245, 158, 11, 0.7);
  }

  .estado {
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
    color: #94a3b8;
  }

  .pendientes {
    text-align: center;
    margin-top: 4px;
    font-size: 12px;
    color: #64748b;
    min-height: 16px;
  }

  .resultado {
    border-radius: 10px;
    padding: 16px;
    font-size: 15px;
    margin-top: 14px;
    text-align: center;
  }

  .ok {
    background: #052e16;
    color: #bbf7d0;
    border: 1px solid #14532d;
  }

  .error {
    background: #450a0a;
    color: #fecaca;
    border: 1px solid #7f1d1d;
  }

  /*
   * NUEVO — estilo de alerta para "duplicado / ya en vuelo". Distinto de
   * ok (verde) y error (rojo) para que el auxiliar entienda de un vistazo
   * que NO es un error real del servidor, sino que ese QR ya se está
   * procesando o se acaba de leer hace un instante.
   */
  .duplicado {
    background: #451a03;
    color: #fde68a;
    border: 1px solid #92400e;
  }

  .nombre {
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 4px;
  }

  /*
   * NUEVO — línea para mostrar el estado del SMS junto con la confirmación
   * de asistencia (campo "smsEstado" que ahora devuelve registrarAsistencia).
   */
  .sms-linea {
    margin-top: 8px;
    font-size: 12px;
    opacity: 0.85;
  }

  input,
  button {
    font-size: 15px;
  }

  #inputManual {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    margin-top: 6px;
  }

  .fila {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .fila input {
    flex: 1;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #334155;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #475569;
  }

  label {
    font-size: 13px;
    color: #94a3b8;
  }

  .toggle {
    display: flex;
    gap: 8px;
    margin: 0 auto 14px;
    max-width: 420px;
  }

  .toggle button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    background: #1e293b;
    border: 2px solid #334155;
    font-size: 16px;
  }

  .toggle button.activo-entrada {
    background: #052e16;
    border-color: #16a34a;
    color: #bbf7d0;
  }

  .toggle button.activo-salida {
    background: #450a0a;
    border-color: #dc2626;
    color: #fecaca;
  }

  .toggle button.btn-cerrar {
    flex: 0 0 auto;
    padding: 12px 14px;
    font-size: 14px;
    color: #94a3b8;
  }

  .toggle button.btn-cerrar:hover {
    background: #334155;
    color: #fecaca;
    border-color: #7f1d1d;
  }
</style>
</head>

<body>

<h3>📷 Lector QR — Control de Asistencia</h3>

<div class="toggle">

  <button
    id="btnModoEntrada"
    onclick="elegirModo('Entrada')">
    ⬆️ Entrada
  </button>

  <button
    id="btnModoSalida"
    onclick="elegirModo('Salida')">
    ⬇️ Salida
  </button>

  <button
    class="btn-cerrar"
    onclick="cerrarApp()"
    title="Cerrar la aplicación">
    Salir
  </button>

</div>

<div id="qr-reader"></div>

<div id="estado" class="estado">
  Solicitando acceso a la cámara…
</div>

<div id="pendientes" class="pendientes"></div>

<div id="resultado"></div>

<label>O ingresar ID manualmente:</label>

<div class="fila">

  <input
    id="inputManual"
    placeholder="DNI del alumno"
    onkeydown="
      if(event.key==='Enter'){
        marcarAsistencia(this.value);
        this.value='';
      }
    "
  >

  <button
    onclick="
      marcarAsistencia(
        document.getElementById('inputManual').value
      );
      document.getElementById('inputManual').value='';
    ">
    Marcar
  </button>

</div>

<script>

  // ============================================================
  // URL DE APPS SCRIPT
  // ============================================================

  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbydoOxtfEKVxvqT7OTwxmtUXlWTBsTi41sVE_LJFFC23EMwfMMzohBoxCsqIC8-tNXh/exec';


  // ============================================================
  // VARIABLES
  // ============================================================

  const estadoDiv =
    document.getElementById('estado');

  const resultadoDiv =
    document.getElementById('resultado');

  const pendientesDiv =
    document.getElementById('pendientes');

  let scannerRef = null;

  let modoActual = 'Entrada';

  /*
   * Guarda los últimos alumnos procesados CON ÉXITO.
   *
   * Esto evita que la cámara lea el mismo QR
   * muchas veces mientras todavía está frente a ella,
   * generando registros duplicados de asistencia.
   */
  const alumnosRecientes = new Map();


  /*
   * Tiempo de protección del mismo QR DESPUÉS de que ya se
   * completó su petición (éxito o error definitivo).
   *
   * 2000 = 2 segundos.
   *
   * Un alumno diferente puede escanearse inmediatamente.
   */
  const COOLDOWN_MS = 2000;


  /*
   * IDs que tienen una petición EN VUELO (todavía esperando respuesta de
   * Apps Script).
   *
   * Antes, si el servidor tardaba más de los 2 segundos del cooldown, el
   * mismo QR podía reenviarse mientras la primera petición seguía
   * procesándose, generando una petición duplicada. Ahora, mientras un ID
   * tenga una petición en vuelo, un nuevo escaneo del mismo QR se ignora
   * por completo hasta que la primera termine (éxito, error, o timeout) —
   * y además se le avisa AL INSTANTE al auxiliar con una alerta ámbar
   * (ver mostrarAlertaDuplicado), en vez de quedarse en silencio.
   */
  const enVuelo = new Set();


  /*
   * Tiempo máximo que esperamos la respuesta de Apps Script
   * antes de darla por perdida y permitir reintentar. Sin esto,
   * si el servidor se cuelga, la petición podía quedar esperando
   * indefinidamente sin dar ningún feedback al auxiliar — dando
   * la sensación de que el lector "se pausó".
   */
  const TIMEOUT_MS = 10000;


  // ============================================================
  // CAMBIAR MODO ENTRADA / SALIDA
  // ============================================================

  function elegirModo(modo) {

    modoActual = modo;

    document.getElementById('btnModoEntrada').className =
      modo === 'Entrada'
        ? 'activo-entrada'
        : '';

    document.getElementById('btnModoSalida').className =
      modo === 'Salida'
        ? 'activo-salida'
        : '';
  }


  elegirModo('Entrada');


  // ============================================================
  // CERRAR APP
  // ============================================================

  function cerrarApp() {

    if (scannerRef) {

      try {
        scannerRef.stop();
      } catch (e) {}

    }

    window.close();
  }


  // ============================================================
  // SONIDO DE FEEDBACK (sin archivos externos)
  // ============================================================
  //
  // Deja que el auxiliar sepa si el escaneo entró bien o falló
  // SIN tener que leer la pantalla — esto agiliza mucho el
  // flujo real cuando hay una fila de alumnos esperando.
  //
  // AJUSTE DE VOLUMEN: se subió la ganancia de 0.15 a 0.9 (el
  // máximo recomendado sin que la onda se distorsione) y se
  // cambió el tipo de onda de 'sine' a 'square', que suena más
  // "llena" y penetrante a volumen alto. También se alargó un
  // poco la duración del beep de éxito para que se note más.
  // Si aun así suena bajo, revisa el volumen de "Multimedia"
  // del celular (no el de "Timbre") y que no esté en silencio.
  // ============================================================

  let audioCtx = null;

  function beep(frecuencia, duracionMs) {

    try {

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square'; // onda cuadrada: más "llena" y penetrante que 'sine'
      osc.frequency.value = frecuencia;
      gain.gain.value = 0.9; // antes 0.15 — máximo recomendado sin distorsionar

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();

      setTimeout(() => {
        osc.stop();
      }, duracionMs);

    } catch (e) {
      // Si el navegador bloquea audio sin interacción previa,
      // simplemente no suena — no debe romper el flujo.
    }
  }

  /*
   * VIBRACIÓN como refuerzo adicional al sonido. Útil cuando el ambiente
   * está ruidoso (fila de alumnos, patio, etc.) y el beep es difícil de
   * escuchar. Si el navegador/dispositivo no soporta vibración (ej.
   * iPhone en Safari), simplemente no hace nada — no rompe el flujo.
   */
  function vibrar(patron) {
    try {
      if (navigator.vibrate) {
        navigator.vibrate(patron);
      }
    } catch (e) { /* silencioso */ }
  }

  function beepExito() {
    beep(880, 200);
    vibrar(80); // vibración corta única = éxito
  }

  function beepError() {
    beep(220, 300);
    vibrar([80, 60, 80]); // dos vibraciones cortas = error/atención
  }

  /*
   * beep INSTANTÁNEO al momento de capturar el QR, antes de esperar la
   * respuesta del servidor. Le da feedback inmediato al auxiliar de que
   * la cámara SÍ leyó el código, sin tener que esperar la latencia de red
   * para escuchar algo. Tono corto y agudo para diferenciarlo del beep de
   * éxito/error que suena después, cuando el servidor ya confirmó el
   * registro.
   */
  function beepCaptura() {
    beep(1200, 70);
    vibrar(30); // vibración muy corta y sutil = "te leí"
  }

  /*
   * NUEVO — beep de duplicado: distinto de éxito (agudo, 880Hz) y de
   * error (grave y largo, 220Hz/300ms). Un tono medio y corto, con doble
   * vibración suave, para que el auxiliar reconozca "este QR ya se está
   * procesando" sin tener que mirar la pantalla.
   */
  function beepDuplicado() {
    beep(500, 150);
    vibrar([40, 40, 40]);
  }

  /*
   * enciende el borde verde del recuadro de la cámara apenas se detecta
   * un QR nuevo (instantáneo), y lo apaga solo después de un momento. Se
   * usa junto con beepCaptura() para dar feedback inmediato antes de que
   * llegue la respuesta del servidor (que sigue mostrando su propio
   * resultado final en verde/rojo dentro de "resultadoDiv", como ya
   * funcionaba).
   */
  const qrReaderDiv = document.getElementById('qr-reader');

  function destelloCaptura() {
    qrReaderDiv.classList.add('destello-captura');
    setTimeout(() => {
      qrReaderDiv.classList.remove('destello-captura');
    }, 350);
  }

  /*
   * NUEVO — destello ámbar para el caso duplicado/en vuelo, distinto del
   * verde de captura nueva.
   */
  function destelloDuplicado() {
    qrReaderDiv.classList.add('destello-duplicado');
    setTimeout(() => {
      qrReaderDiv.classList.remove('destello-duplicado');
    }, 350);
  }

  /*
   * NUEVO — alerta INSTANTÁNEA de duplicado. Se dispara 100% del lado del
   * cliente (sin llamar al servidor), así que aparece de inmediato, igual
   * que el beep de captura. Se usa en los dos casos en que antes el
   * escaneo se ignoraba en silencio: (a) ya hay una petición en vuelo
   * para este mismo ID, o (b) el mismo ID se escaneó hace menos de
   * COOLDOWN_MS.
   */
  function mostrarAlertaDuplicado() {
    resultadoDiv.innerHTML =
      '<div class="resultado duplicado">⏳ Ya se está procesando este código, espera un momento.</div>';
    beepDuplicado();
    destelloDuplicado();
  }


  // ============================================================
  // CONTADOR DE PENDIENTES (feedback visual de que sí procesa)
  // ============================================================

  function actualizarContadorPendientes() {

    if (enVuelo.size === 0) {
      pendientesDiv.textContent = '';
    } else {
      pendientesDiv.textContent =
        enVuelo.size === 1
          ? '1 registro procesándose…'
          : enVuelo.size + ' registros procesándose…';
    }
  }


  // ============================================================
  // MOSTRAR RESULTADO
  // ============================================================
  //
  // NUEVO parámetro "smsEstado": si el backend lo envía (campo
  // "smsEstado" en la respuesta de registrarAsistencia), se muestra como
  // una línea aparte debajo del mensaje principal, junto con la misma
  // confirmación verde/roja — sin esperar a una segunda respuesta.
  // ============================================================

  function mostrarResultado(ok, texto, nombre, smsEstado) {

    resultadoDiv.innerHTML =

      '<div class="resultado ' +
      (ok ? 'ok' : 'error') +
      '">' +

      (nombre
        ? '<div class="nombre">' +
          nombre +
          '</div>'
        : '') +

      (ok ? '✅ ' : '⚠️ ') +

      texto +

      (smsEstado
        ? '<div class="sms-linea">📩 ' + smsEstado + '</div>'
        : '') +

      '</div>';

    if (ok) {
      beepExito();
    } else {
      beepError();
    }
  }


  // ============================================================
  // MARCAR ASISTENCIA
  // ============================================================
  //
  // IMPORTANTE:
  //
  // ESTA VERSIÓN NO PAUSA LA CÁMARA.
  //
  // El QR se detecta y la solicitud se envía a Apps Script
  // en segundo plano.
  //
  // Mientras Apps Script responde, la cámara sigue funcionando.
  //
  // ============================================================

  function marcarAsistencia(idAlumno, esReintento) {

    idAlumno = (idAlumno || '').trim();

    if (!idAlumno) {
      return;
    }


    // ----------------------------------------------------------
    // EVITAR REENVÍO MIENTRAS YA HAY UNA PETICIÓN EN VUELO
    // PARA ESTE MISMO ID.
    //
    // NUEVO: en vez de ignorar en silencio, se muestra una alerta
    // instantánea (sin tocar el servidor) para que el auxiliar sepa
    // de inmediato por qué no pasó nada nuevo.
    // ----------------------------------------------------------

    if (!esReintento && enVuelo.has(idAlumno)) {
      mostrarAlertaDuplicado();
      return;
    }


    // ----------------------------------------------------------
    // EVITAR REPETICIÓN DEL MISMO QR (cooldown post-éxito/error)
    //
    // NUEVO: mismo tratamiento — alerta instantánea en vez de silencio.
    // ----------------------------------------------------------

    const ahora = Date.now();

    const ultimoTiempo =
      alumnosRecientes.get(idAlumno) || 0;


    if (
      !esReintento &&
      ahora - ultimoTiempo < COOLDOWN_MS
    ) {

      mostrarAlertaDuplicado();
      return;

    }


    // ----------------------------------------------------------
    // COMPROBAR URL
    // ----------------------------------------------------------

    if (
      !URL_APPS_SCRIPT ||
      URL_APPS_SCRIPT.indexOf('PEGA_AQUI') > -1
    ) {

      mostrarResultado(
        false,
        'Falta configurar la URL de Apps Script.'
      );

      return;
    }


    // ----------------------------------------------------------
    // BEEP INSTANTÁNEO DE CAPTURA
    // ----------------------------------------------------------
    // Suena AQUÍ, justo después de confirmar que es una lectura
    // nueva (no un duplicado del mismo QR ni un reintento), y
    // ANTES de esperar la respuesta del servidor. Así el auxiliar
    // escucha algo de inmediato al pasar el QR frente a la cámara,
    // sin depender de la latencia de la red.
    if (!esReintento) {
      beepCaptura();
      destelloCaptura();
    }


    // ----------------------------------------------------------
    // MARCAR COMO "EN VUELO"
    // ----------------------------------------------------------

    enVuelo.add(idAlumno);
    actualizarContadorPendientes();


    // ----------------------------------------------------------
    // ESTADO
    // ----------------------------------------------------------

    estadoDiv.textContent =
      'Enviando ' +
      modoActual +
      '…';


    // ----------------------------------------------------------
    // CONSTRUIR URL
    // ----------------------------------------------------------

    const url =

      URL_APPS_SCRIPT +

      '?accion=marcarAsistencia' +

      '&idAlumno=' +
      encodeURIComponent(idAlumno) +

      '&tipoMovimiento=' +
      encodeURIComponent(modoActual);


    // ----------------------------------------------------------
    // TIMEOUT — evita que una petición colgada deje al auxiliar
    // sin feedback indefinidamente.
    // ----------------------------------------------------------

    const controller = new AbortController();

    const timeoutId = setTimeout(() => {
      controller.abort();
    }, TIMEOUT_MS);


    // ----------------------------------------------------------
    // ENVIAR A APPS SCRIPT
    // ----------------------------------------------------------
    //
    // IMPORTANTE:
    //
    // NO usamos await.
    // NO pausamos scanner.
    // NO usamos scanner.pause().
    //
    // Por eso el lector continúa funcionando.
    // ----------------------------------------------------------

    fetch(url, { signal: controller.signal })

      .then(response => {

        clearTimeout(timeoutId);

        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status
          );

        }

        return response.json();

      })

      .then(data => {

        mostrarResultado(

          !!data.success,

          data.message ||
          'Registro procesado.',

          data.alumno
            ? data.alumno.Nombre_Completo
            : null,

          data.smsEstado || null // ← NUEVO: estado del SMS, junto con la confirmación

        );

        // Cooldown normal solo cuando SÍ terminó (éxito o error
        // definitivo del servidor, no timeout de red).
        alumnosRecientes.set(idAlumno, Date.now());

      })

      .catch(err => {

        clearTimeout(timeoutId);

        const fueTimeout =
          err && err.name === 'AbortError';

        // ------------------------------------------------------
        // REINTENTO AUTOMÁTICO (1 vez) si fue timeout o falla de
        // red — sin esto, un solo error de conexión obligaba al
        // auxiliar a volver a escanear manualmente.
        // ------------------------------------------------------

        if (!esReintento) {

          enVuelo.delete(idAlumno);
          actualizarContadorPendientes();

          estadoDiv.textContent =
            'Reintentando ' + idAlumno + '…';

          marcarAsistencia(idAlumno, true);

          return; // no mostramos error todavía, se reintenta
        }

        mostrarResultado(

          false,

          fueTimeout
            ? 'El servidor tardó demasiado en responder. Intenta escanear de nuevo.'
            : 'No se pudo conectar con el servidor: ' + err.message

        );

        alumnosRecientes.set(idAlumno, Date.now());

      })

      .finally(() => {

        enVuelo.delete(idAlumno);
        actualizarContadorPendientes();

        /*
         * La cámara nunca fue pausada.
         *
         * Por eso aquí NO hacemos:
         *
         * scanner.pause()
         *
         * ni:
         *
         * scanner.resume()
         */

        estadoDiv.textContent =
          'Apunta la cámara al código QR…';

      });

  }


  // ============================================================
  // INICIAR LECTOR QR
  // ============================================================

  if (
    typeof Html5Qrcode === 'undefined'
  ) {

    estadoDiv.innerHTML =
      '<div class="resultado error">' +
      'No se pudo cargar la librería del lector QR. ' +
      'Revisa tu conexión a internet.' +
      '</div>';

  }

  else if (!window.isSecureContext) {

    estadoDiv.innerHTML =
      '<div class="resultado error">' +
      'Esta página debe abrirse por HTTPS ' +
      'para poder usar la cámara.' +
      '</div>';

  }

  else {

    Html5Qrcode
      .getCameras()

      .then(camaras => {

        if (
          !camaras ||
          camaras.length === 0
        ) {

          estadoDiv.innerHTML =
            '<div class="resultado error">' +
            'No se detectó ninguna cámara conectada.' +
            '</div>';

          return;
        }


        // ------------------------------------------------------
        // BUSCAR CÁMARA TRASERA
        // ------------------------------------------------------

        const trasera =

          camaras.find(c =>
            /back|trasera|rear|environment/i
              .test(c.label || '')
          );


        const elegida =
          trasera || camaras[0];


        // ------------------------------------------------------
        // CREAR ESCÁNER
        // ------------------------------------------------------

        const scanner =
          new Html5Qrcode('qr-reader');


        scannerRef = scanner;


        // ------------------------------------------------------
        // INICIAR CÁMARA
        // ------------------------------------------------------

        scanner.start(

          {
            deviceId: {
              exact: elegida.id
            }
          },

          {
            /*
             * 10 análisis por segundo.
             *
             * Puedes subirlo a 12 o 15 si tu celular
             * tiene buen rendimiento.
             */
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }

          },

          /*
           * QR DETECTADO
           */

          decodedText => {

            /*
             * IMPORTANTE:
             *
             * Solo enviamos el ID.
             *
             * NO pausamos la cámara.
             */

            marcarAsistencia(
              decodedText
            );

          },

          /*
           * Frame sin QR.
           *
           * No hacemos nada.
           */

          () => {}

        )

        .then(() => {

          estadoDiv.textContent =
            'Apunta la cámara al código QR…';

        })

        .catch(err => {

          const nombre =
            (err && err.name) ||
            String(err);


          let ayuda =
            'No se pudo acceder a la cámara (' +
            nombre +
            ').';


          if (
            nombre.indexOf('NotAllowed') > -1
          ) {

            ayuda +=
              ' Revisa el permiso de cámara ' +
              'para este sitio en tu navegador.';

          }

          else if (
            nombre.indexOf('NotReadable') > -1
          ) {

            ayuda +=
              ' La cámara está siendo usada ' +
              'por otra aplicación.';

          }


          estadoDiv.innerHTML =
            '<div class="resultado error">' +
            ayuda +
            '</div>';

        });

      })

      .catch(err => {

        estadoDiv.innerHTML =
          '<div class="resultado error">' +
          'No se pudo listar las cámaras: ' +
          ((err && err.message) || err) +
          '</div>';

      });

  }


  // ============================================================
  // SERVICE WORKER
  // ============================================================

  if (
    'serviceWorker' in navigator
  ) {

    navigator.serviceWorker
      .register('sw.js')
      .catch(() => {

        /*
         * Si falla el Service Worker,
         * el lector sigue funcionando normalmente.
         */

      });

  }

</script>

</body>
</html>
