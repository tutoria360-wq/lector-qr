<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lector QR — Asistencia</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lector QR">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; }
  h3 { text-align: center; font-size: 16px; margin: 0 0 14px; }

  #qr-reader {
    width: 100%; max-width: 420px; margin: 0 auto; border-radius: 12px; overflow: hidden;
    border: 4px solid transparent; transition: border-color 0.05s ease-out;
  }
  #qr-reader.destello-exito { border-color: #22c55e; box-shadow: 0 0 24px 4px rgba(34, 197, 94, 0.7); }
  #qr-reader.destello-error { border-color: #ef4444; box-shadow: 0 0 24px 4px rgba(239, 68, 68, 0.7); }
  #qr-reader.pausada { border-color: #f59e0b; box-shadow: 0 0 16px 2px rgba(245, 158, 11, 0.5); }

  .estado { text-align: center; margin-top: 14px; font-size: 14px; color: #94a3b8; }
  .pendientes { text-align: center; margin-top: 4px; font-size: 12px; color: #64748b; min-height: 16px; }

  .resultado { border-radius: 10px; padding: 16px; font-size: 15px; margin-top: 14px; text-align: center; }
  .ok { background: #052e16; color: #bbf7d0; border: 1px solid #14532d; }
  .error { background: #450a0a; color: #fecaca; border: 1px solid #7f1d1d; }
  .duplicado { background: #451a03; color: #fde68a; border: 1px solid #92400e; }

  .badge-duplicado {
    display: inline-block; background: #f59e0b; color: #451a03; font-weight: 800; font-size: 13px;
    letter-spacing: 1px; padding: 4px 14px; border-radius: 999px; margin-bottom: 8px;
    animation: pulso-duplicado 1s ease-in-out infinite;
  }
  @keyframes pulso-duplicado { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .datos-alumno-dup { font-size: 12px; color: #fcd34d; margin-bottom: 6px; }
  .mensaje-duplicado { font-size: 14px; }
  .nombre { font-weight: 700; font-size: 17px; margin-bottom: 4px; }
  .sms-linea { margin-top: 8px; font-size: 12px; opacity: 0.85; }

  input, button { font-size: 15px; }
  #inputManual {
    width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px;
    border: 1px solid #334155; background: #1e293b; color: #e2e8f0; margin-top: 6px;
  }
  .fila { display: flex; gap: 8px; margin-top: 6px; }
  .fila input { flex: 1; }
  button { padding: 10px 14px; border: none; border-radius: 8px; background: #334155; color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { background: #475569; }
  button:disabled { opacity: 0.6; cursor: default; }
  label { font-size: 13px; color: #94a3b8; }

  .toggle { display: flex; gap: 8px; margin: 0 auto 14px; max-width: 420px; }
  .toggle button { flex: 1; padding: 12px; border-radius: 10px; background: #1e293b; border: 2px solid #334155; font-size: 16px; }
  .toggle button.activo-entrada { background: #052e16; border-color: #16a34a; color: #bbf7d0; }
  .toggle button.activo-salida { background: #450a0a; border-color: #dc2626; color: #fecaca; }
  .toggle button.btn-cerrar { flex: 0 0 auto; padding: 12px 14px; font-size: 14px; color: #94a3b8; }
  .toggle button.btn-cerrar:hover { background: #334155; color: #fecaca; border-color: #7f1d1d; }

  /* Bloque "Actualizar lista" */
  .cache-bloque { max-width: 420px; margin: 14px auto 0; text-align: center; }
  .cache-bloque button { background: #1e293b; border: 1px solid #334155; font-size: 13px; padding: 8px 14px; }
  .cache-bloque button:hover { background: #334155; }
  .cache-info { font-size: 11px; color: #64748b; margin-top: 6px; }
</style>
</head>

<body>

<h3>📷 Lector QR — Control de Asistencia</h3>

<div class="toggle">
  <button id="btnModoEntrada" onclick="elegirModo('Entrada')">⬆️ Entrada</button>
  <button id="btnModoSalida" onclick="elegirModo('Salida')">⬇️ Salida</button>
  <button class="btn-cerrar" onclick="cerrarApp()" title="Cerrar la aplicación">Salir</button>
</div>

<div id="qr-reader"></div>
<div id="estado" class="estado">Solicitando acceso a la cámara…</div>
<div id="pendientes" class="pendientes"></div>
<div id="resultado"></div>

<label>O ingresar ID manualmente:</label>
<div class="fila">
  <input id="inputManual" placeholder="DNI del alumno"
    onkeydown="if(event.key==='Enter'){ marcarAsistencia(this.value); this.value=''; }">
  <button onclick="marcarAsistencia(document.getElementById('inputManual').value); document.getElementById('inputManual').value='';">Marcar</button>
</div>

<div class="cache-bloque">
  <button id="btnActualizarLista" onclick="actualizarListaManual()">🔄 Actualizar lista</button>
  <div id="cacheInfo" class="cache-info"></div>
</div>

<p style="text-align:center; font-size:10px; color:#475569; margin-top:14px; font-family:monospace;">
  v2026-10-06-sin-falso-duplicado
</p>

<script>

  // ============================================================
  // URLS
  // ============================================================
  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbydoOxtfEKVxvqT7OTwxmtUXlWTBsTi41sVE_LJFFC23EMwfMMzohBoxCsqIC8-tNXh/exec';

  const URL_PROXY = 'https://asistencia-proxy.tutoria360.workers.dev/';

  // URL que se usa realmente (cambia a URL_APPS_SCRIPT si necesitas saltarte el proxy).
  const URL_ENVIO = URL_PROXY;

  // ============================================================
  // VARIABLES
  // ============================================================
  const estadoDiv = document.getElementById('estado');
  const resultadoDiv = document.getElementById('resultado');
  const pendientesDiv = document.getElementById('pendientes');
  const qrReaderDiv = document.getElementById('qr-reader');

  let scannerRef = null;
  let modoActual = 'Entrada';

  // Cámara: se apaga sola con la pantalla oculta y se reactiva al volver.
  let camaraDeviceId = null;
  let camaraActiva = false;
  let pausadoPorCooldown = false;

  const CONFIG_QR = {
    fps: 8,
    qrbox: { width: 250, height: 250 },
    disableFlip: true
  };

  function detenerCamara_() {
    if (!scannerRef || !camaraActiva) return;
    scannerRef.stop()
      .then(() => {
        camaraActiva = false;
        qrReaderDiv.classList.add('pausada');
        estadoDiv.textContent = 'Cámara en pausa (pantalla oculta o app en segundo plano)…';
      })
      .catch(() => { camaraActiva = false; });
  }

  function iniciarCamara_() {
    if (!scannerRef || camaraActiva) return;
    qrReaderDiv.classList.remove('pausada');
    estadoDiv.textContent = 'Reactivando cámara…';
    scannerRef.start(
      { facingMode: 'environment' },
      CONFIG_QR,
      decodedText => marcarAsistencia(decodedText),
      () => {}
    )
      .then(() => {
        camaraActiva = true;
        estadoDiv.textContent = 'Apunta la cámara al código QR…';
      })
      .catch(err => {
        estadoDiv.innerHTML =
          '<div class="resultado error">No se pudo reactivar la cámara: ' + ((err && err.message) || err) + '</div>';
      });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      detenerCamara_();
    } else {
      iniciarCamara_();
      refrescarCacheSiCaduco_(); // solo descarga si ya pasaron 3 horas
      actualizarInfoCache_();
    }
  });

  window.addEventListener('pagehide', () => { detenerCamara_(); });

  // ============================================================
  // ESTADO DE SOLICITUDES
  // ============================================================
  // enProceso: un solo objeto "entrada" activo por alumno; se borra por referencia (===).
  const enProceso = new Map();

  // Secuencia de escaneo: descarta respuestas atrasadas que ya no corresponden al escaneo actual.
  let secuenciaEscaneo = 0;

  function actualizarEstadoSiVigente_(texto, seq) {
    if (typeof seq === 'number' && seq !== secuenciaEscaneo) return;
    estadoDiv.textContent = texto;
  }

  const alumnosRecientes = new Map();

  // Debe coincidir con la ventana anti-duplicados del servidor (120 s).
  const COOLDOWN_DUPLICADO_MS = 120000;
  // Pausa breve de decodificación tras leer un QR.
  const PAUSA_CAMARA_MS = 1000;

  // Si el MISMO QR sigue frente a la cámara, se ignora en silencio (no pisa el
  // resultado verde ni invalida la respuesta del servidor del primer escaneo).
  // Solo cuenta como nuevo escaneo si el QR se apartó al menos este tiempo.
  const IGNORAR_RELECTURA_MS = 5000;
  let ultimoIdLeido = null;
  let ultimaLecturaTs = 0;

  const MAX_CONCURRENCIA = 2;
  const colaEspera = [];
  let solicitudesActivas = 0;

  const MAX_INTENTOS = 2;
  const TIMEOUT_MS = 12000;

  // ============================================================
  // CACHÉ LOCAL DE ALUMNOS (localStorage) — dura 3 horas
  // ============================================================
  const CLAVE_CACHE_ALUMNOS = 'academia_alumnos_cache_v1';
  const CADUCIDAD_CACHE_MS = 3 * 60 * 60 * 1000;   // 3 horas
  const ESPERA_TRAS_FALLO_MS = 60 * 1000;          // tras un fallo automático, esperar 1 min

  let cacheAlumnos = null; // { alumnos, porId, porDni, timestamp }
  let refrescandoCache = false;
  let ultimoFalloCache = 0;

  function guardarCacheAlumnosEnStorage_(alumnos) {
    const paquete = { alumnos: alumnos, timestamp: Date.now() };
    try {
      localStorage.setItem(CLAVE_CACHE_ALUMNOS, JSON.stringify(paquete));
    } catch (e) {
      console.warn('No se pudo guardar la caché de alumnos en localStorage:', e);
    }
    indexarCacheAlumnos_(alumnos, paquete.timestamp);
  }

  function indexarCacheAlumnos_(alumnos, timestamp) {
    const porId = {};
    const porDni = {};
    (alumnos || []).forEach(function (a, i) {
      if (a.ID_Alumno) porId[String(a.ID_Alumno).trim()] = i;
      if (a.DNI) porDni[String(a.DNI).trim()] = i;
    });
    cacheAlumnos = { alumnos: alumnos || [], porId: porId, porDni: porDni, timestamp: timestamp || 0 };
  }

  function cargarCacheAlumnosDeStorage_() {
    try {
      const crudo = localStorage.getItem(CLAVE_CACHE_ALUMNOS);
      if (!crudo) return;
      const paquete = JSON.parse(crudo);
      indexarCacheAlumnos_(paquete.alumnos, paquete.timestamp);
    } catch (e) {
      console.warn('No se pudo leer la caché de alumnos de localStorage:', e);
    }
  }

  function buscarAlumnoEnCache(idBuscado) {
    if (!cacheAlumnos) return null;
    const buscado = String(idBuscado).trim();
    let pos = Object.prototype.hasOwnProperty.call(cacheAlumnos.porId, buscado)
      ? cacheAlumnos.porId[buscado]
      : (Object.prototype.hasOwnProperty.call(cacheAlumnos.porDni, buscado) ? cacheAlumnos.porDni[buscado] : undefined);
    if (pos === undefined) return null;
    return cacheAlumnos.alumnos[pos];
  }

  function parseFechaDDMMYYYY_(str) {
    if (!str) return null;
    const partes = String(str).trim().split('/');
    if (partes.length !== 3) return null;
    const d = parseInt(partes[0], 10), m = parseInt(partes[1], 10), a = parseInt(partes[2], 10);
    if (!d || !m || !a) return null;
    return new Date(a, m - 1, d);
  }

  function alumnoEstaVencido_(alumno) {
    const fechaVenc = parseFechaDDMMYYYY_(alumno.Fecha_Vencimiento);
    if (!fechaVenc) return false;
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    return fechaVenc < hoy;
  }

  function cacheCaducada_() {
    return !cacheAlumnos || !cacheAlumnos.timestamp ||
      (Date.now() - cacheAlumnos.timestamp) > CADUCIDAD_CACHE_MS;
  }

  /** Descarga automática: solo si no hay caché o ya pasaron 3 horas desde la última descarga. */
  function refrescarCacheSiCaduco_() {
    if (refrescandoCache || !cacheCaducada_()) return;
    if (!navigator.onLine) return;
    if (Date.now() - ultimoFalloCache < ESPERA_TRAS_FALLO_MS) return;
    refrescarCacheAlumnos();
  }

  /**
   * Descarga la lista del servidor y actualiza la caché.
   * Devuelve una promesa que resuelve true (ok) o false (falló).
   */
  function refrescarCacheAlumnos() {
    if (!URL_ENVIO || URL_ENVIO.indexOf('PEGA-AQUI') > -1) return Promise.resolve(false);
    refrescandoCache = true;

    return fetch(URL_ENVIO + '?accion=listaAlumnos')
      .then(r => r.json())
      .then(data => {
        if (!data || !data.success) { ultimoFalloCache = Date.now(); return false; }

        let alumnos = null;
        if (Array.isArray(data.filas)) {            // formato compacto
          const campos = data.campos || [];
          alumnos = data.filas.map(f => {
            const o = {};
            campos.forEach((c, i) => { o[c] = f[i]; });
            return o;
          });
        } else if (Array.isArray(data.alumnos)) {   // formato actual
          alumnos = data.alumnos;
        }

        if (!alumnos) { ultimoFalloCache = Date.now(); return false; }

        guardarCacheAlumnosEnStorage_(alumnos);
        console.log('Caché de alumnos actualizada: ' + alumnos.length + ' alumno(s).');
        return true;
      })
      .catch(err => {
        ultimoFalloCache = Date.now();
        console.warn('No se pudo refrescar la caché de alumnos:', err);
        return false;
      })
      .finally(() => {
        refrescandoCache = false;
        actualizarInfoCache_();
      });
  }

  // ---------- Botón "Actualizar lista" ----------

  function textoHace_(ms) {
    const min = Math.floor(ms / 60000);
    if (min < 1) return 'hace menos de 1 min';
    if (min < 60) return 'hace ' + min + ' min';
    const h = Math.floor(min / 60);
    const m = min % 60;
    return 'hace ' + h + ' h' + (m ? ' ' + m + ' min' : '');
  }

  function actualizarInfoCache_() {
    const el = document.getElementById('cacheInfo');
    if (!el) return;
    if (!cacheAlumnos || !cacheAlumnos.timestamp) {
      el.textContent = 'Lista de alumnos: sin descargar todavía';
      return;
    }
    el.textContent = 'Lista: ' + cacheAlumnos.alumnos.length + ' alumnos · actualizada ' +
      textoHace_(Date.now() - cacheAlumnos.timestamp);
  }

  function actualizarListaManual() {
    const btn = document.getElementById('btnActualizarLista');
    const info = document.getElementById('cacheInfo');

    if (refrescandoCache) { info.textContent = 'Ya se está actualizando…'; return; }
    if (!navigator.onLine) { info.textContent = 'Sin internet: no se pudo actualizar.'; return; }

    btn.disabled = true;
    btn.textContent = '⏳ Actualizando…';

    refrescarCacheAlumnos().then(ok => {
      btn.disabled = false;
      btn.textContent = '🔄 Actualizar lista';
      if (ok) {
        info.textContent = '✅ Lista actualizada: ' + cacheAlumnos.alumnos.length + ' alumnos';
        setTimeout(actualizarInfoCache_, 4000);
      } else {
        info.textContent = '⚠️ No se pudo actualizar. Revisa tu conexión e inténtalo de nuevo.';
      }
    });
  }

  // ============================================================
  // COLA PERSISTENTE DE REGISTROS PENDIENTES (localStorage)
  // ============================================================
  const CLAVE_COLA_PENDIENTE = 'academia_cola_pendiente_v1';
  const INTERVALO_REINTENTO_COLA_MS = 5000;
  const MAX_INTENTOS_COLA = 20;

  function leerColaPendiente_() {
    try {
      const crudo = localStorage.getItem(CLAVE_COLA_PENDIENTE);
      return crudo ? JSON.parse(crudo) : [];
    } catch (e) {
      return [];
    }
  }

  function guardarColaPendiente_(cola) {
    try {
      localStorage.setItem(CLAVE_COLA_PENDIENTE, JSON.stringify(cola));
    } catch (e) {
      console.warn('No se pudo guardar la cola pendiente en localStorage:', e);
    }
  }

  function agregarAColaPendiente_(item) {
    const cola = leerColaPendiente_();
    cola.push(item);
    guardarColaPendiente_(cola);
    actualizarContadorPendientes();
  }

  function alumnoTieneAlgoPendiente(idAlumno) {
    if (enProceso.has(idAlumno)) return true;
    return leerColaPendiente_().some(function (item) { return item.idAlumno === idAlumno; });
  }

  function procesarColaPendientePersistente() {
    if (!navigator.onLine) return; // sin red no se gasta nada

    const cola = leerColaPendiente_();
    if (cola.length === 0) return;

    const pendientesDeIntentar = cola.filter(function (item) { return !item.requiereRevisionManual; });
    if (pendientesDeIntentar.length === 0) return;

    const item = pendientesDeIntentar[0];
    item.intentos = (item.intentos || 0) + 1;

    const url =
      URL_ENVIO +
      '?accion=marcarAsistencia' +
      '&idAlumno=' + encodeURIComponent(item.idAlumno) +
      '&tipoMovimiento=' + encodeURIComponent(item.tipoMovimiento) +
      '&requestId=' + encodeURIComponent(item.requestId);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(url, { signal: controller.signal })
      .then(r => { clearTimeout(timeoutId); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        quitarDeColaPendiente_(item.requestId);
        if (!data.success && esRechazoDeNegocio_(data)) {
          mostrarAlertaCorreccion_(item.nombreAlumno || item.idAlumno, data.message);
        }
      })
      .catch(() => {
        clearTimeout(timeoutId);
        const colaActual = leerColaPendiente_();
        const idx = colaActual.findIndex(function (c) { return c.requestId === item.requestId; });
        if (idx > -1) {
          colaActual[idx].intentos = item.intentos;
          if (item.intentos >= MAX_INTENTOS_COLA) {
            colaActual[idx].requiereRevisionManual = true;
          }
          guardarColaPendiente_(colaActual);
          actualizarContadorPendientes();
        }
      });
  }

  function quitarDeColaPendiente_(requestId) {
    const cola = leerColaPendiente_().filter(function (item) { return item.requestId !== requestId; });
    guardarColaPendiente_(cola);
    actualizarContadorPendientes();
  }

  function reintentarColaPendienteManualmente() {
    const cola = leerColaPendiente_().map(function (item) {
      item.requiereRevisionManual = false;
      return item;
    });
    guardarColaPendiente_(cola);
    procesarColaPendientePersistente();
  }

  function esRechazoDeNegocio_(data) {
    return !!(data && data.tipoError && ['vencido', 'retirado', 'no_registrado', 'muy_reciente'].indexOf(data.tipoError) > -1);
  }

  const ultimasCorreccionesMostradas = new Map();
  const VENTANA_SIN_REPETIR_CORRECCION_MS = 30000;

  function mostrarAlertaCorreccion_(nombreOId, mensajeServidor) {
    const clave = nombreOId + '|' + mensajeServidor;
    const ahora = Date.now();
    if (ahora - (ultimasCorreccionesMostradas.get(clave) || 0) < VENTANA_SIN_REPETIR_CORRECCION_MS) return;
    ultimasCorreccionesMostradas.set(clave, ahora);

    const div = document.createElement('div');
    div.className = 'resultado duplicado';
    div.innerHTML = '⚠️ <strong>Revisar ' + nombreOId + ':</strong> ' + mensajeServidor;
    resultadoDiv.prepend(div);
    beepError();
    vibrar([100, 60, 100, 60, 100]);
  }

  function mostrarDuplicadoInmediato_(mensaje, alumno, secuencia) {
    if (typeof secuencia === 'number' && secuencia !== secuenciaEscaneo) return;

    const datosExtra = alumno
      ? '<div class="datos-alumno-dup">' +
          (alumno.DNI ? 'DNI: ' + alumno.DNI : '') +
          (alumno.Modalidad ? ' &nbsp;·&nbsp; ' + alumno.Modalidad : '') +
          (alumno.Grupo_Salon ? ' - ' + alumno.Grupo_Salon : '') +
        '</div>'
      : '';

    resultadoDiv.innerHTML =
      '<div class="resultado duplicado">' +
      '<div class="badge-duplicado">⏳ DUPLICADO</div>' +
      (alumno ? '<div class="nombre">' + alumno.Nombre_Completo + '</div>' : '') +
      datosExtra +
      '<div class="mensaje-duplicado">' + mensaje + '</div>' +
      '</div>';

    beepDuplicado();
  }

  function elegirModo(modo) {
    modoActual = modo;
    document.getElementById('btnModoEntrada').className = modo === 'Entrada' ? 'activo-entrada' : '';
    document.getElementById('btnModoSalida').className = modo === 'Salida' ? 'activo-salida' : '';
  }
  elegirModo('Entrada');

  function cerrarApp() {
    detenerCamara_();
    window.close();
  }

  // ============================================================
  // SONIDO Y VIBRACIÓN
  // ============================================================
  let audioCtx = null;

  function beep(frecuencia, duracionMs) {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = frecuencia;
      gain.gain.value = 0.9;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      setTimeout(() => { osc.stop(); }, duracionMs);
    } catch (e) { /* si el navegador bloquea el audio, no rompe el flujo */ }
  }

  function vibrar(patron) {
    try { if (navigator.vibrate) navigator.vibrate(patron); } catch (e) { /* silencioso */ }
  }

  function beepExito() { beep(880, 200); vibrar(80); }
  function beepError() { beep(220, 300); vibrar([80, 60, 80]); }
  function beepDuplicado() {
    beep(660, 90);
    setTimeout(() => beep(660, 90), 150);
    vibrar([40, 40, 40]);
  }

  function destelloExito() {
    qrReaderDiv.classList.add('destello-exito');
    setTimeout(() => { qrReaderDiv.classList.remove('destello-exito'); }, 400);
  }

  function destelloError() {
    qrReaderDiv.classList.add('destello-error');
    setTimeout(() => { qrReaderDiv.classList.remove('destello-error'); }, 400);
  }

  // ============================================================
  // CONTADOR DE PENDIENTES
  // ============================================================
  function actualizarContadorPendientes() {
    const enMemoria = enProceso.size;
    const cola = leerColaPendiente_();
    const enColaPersistente = cola.length;
    const requierenRevision = cola.filter(function (i) { return i.requiereRevisionManual; }).length;
    const total = enMemoria + enColaPersistente;

    if (total === 0) {
      pendientesDiv.innerHTML = '';
      return;
    }

    let texto = total === 1 ? '1 registro procesándose…' : total + ' registros procesándose…';
    if (enColaPersistente > 0) {
      texto = enColaPersistente === 1
        ? '1 registro pendiente de sincronizar (guardado, se reintenta solo)'
        : enColaPersistente + ' registros pendientes de sincronizar (guardados, se reintentan solos)';
    }

    if (requierenRevision > 0) {
      pendientesDiv.innerHTML = texto +
        ' <button onclick="reintentarColaPendienteManualmente()" style="margin-left:6px;padding:2px 8px;font-size:11px;">Reintentar ahora</button>';
    } else {
      pendientesDiv.textContent = texto;
    }
  }

  // ============================================================
  // MOSTRAR RESULTADO
  // ============================================================
  function mostrarResultado(ok, texto, nombre, smsEstado, diagnosticoTiempos, secuencia) {
    if (typeof secuencia === 'number' && secuencia !== secuenciaEscaneo) return;

    let lineaDiag = '';
    if (diagnosticoTiempos) {
      const partes = Object.keys(diagnosticoTiempos).map(k => k + '=' + diagnosticoTiempos[k]);
      lineaDiag =
        '<div style="margin-top:8px;font-size:10px;color:#64748b;font-family:monospace;word-break:break-all;">' +
        '⏱️ ' + partes.join(' · ') +
        '</div>';
    }

    resultadoDiv.innerHTML =
      '<div class="resultado ' + (ok ? 'ok' : 'error') + '">' +
      (nombre ? '<div class="nombre">' + nombre + '</div>' : '') +
      (ok ? '✅ ' : '⚠️ ') + texto +
      (smsEstado ? '<div class="sms-linea">📩 ' + smsEstado + '</div>' : '') +
      lineaDiag +
      '</div>';

    if (ok) {
      beepExito();
      destelloExito();
    } else {
      beepError();
      destelloError();
    }
  }

  // ============================================================
  // MARCAR ASISTENCIA — punto de entrada (cámara e input manual)
  // ============================================================
  function marcarAsistencia(idAlumnoRaw) {

    const idAlumno = (idAlumnoRaw || '').trim();
    if (!idAlumno) return;

    // Relectura del MISMO QR que sigue frente a la cámara: se ignora en silencio.
    // No pisa el resultado verde ni incrementa la secuencia (que invalidaría la
    // respuesta real del servidor del primer escaneo).
    const t = Date.now();
    if (idAlumno === ultimoIdLeido && (t - ultimaLecturaTs) < IGNORAR_RELECTURA_MS) {
      ultimaLecturaTs = t; // mientras siga visible, sigue ignorándose
      return;
    }
    ultimoIdLeido = idAlumno;
    ultimaLecturaTs = t;

    refrescarCacheSiCaduco_(); // uso real: solo descarga si ya pasaron 3 horas

    const miSecuencia = ++secuenciaEscaneo;
    const alumnoLocalParaNombre = buscarAlumnoEnCache(idAlumno);

    // Duplicado real: el alumno volvió a escanear tras apartar el QR.
    const ahora = Date.now();
    if (ahora - (alumnosRecientes.get(idAlumno) || 0) < COOLDOWN_DUPLICADO_MS) {
      mostrarDuplicadoInmediato_('Ya tiene un movimiento registrado hace unos segundos.', alumnoLocalParaNombre, miSecuencia);
      return;
    }

    // Ya hay un intento en curso o en la cola persistente.
    if (alumnoTieneAlgoPendiente(idAlumno)) {
      mostrarDuplicadoInmediato_('Ya se está procesando, espera un momento.', alumnoLocalParaNombre, miSecuencia);
      return;
    }

    if (!URL_ENVIO || URL_ENVIO.indexOf('PEGA-AQUI') > -1) {
      mostrarResultado(false, 'Falta configurar la URL del proxy (URL_PROXY) en el lector.', null, null, null, miSecuencia);
      return;
    }

    // Validación local primero: confirmación instantánea sin depender de la red.
    const alumnoLocal = alumnoLocalParaNombre;

    if (alumnoLocal) {

      if (alumnoLocal.Estado_Matricula === 'Retirado') {
        alumnosRecientes.set(idAlumno, ahora);
        mostrarResultado(false, alumnoLocal.Nombre_Completo + ' está RETIRADO. No se puede registrar asistencia.', alumnoLocal.Nombre_Completo, null, null, miSecuencia);
        return;
      }

      if (alumnoEstaVencido_(alumnoLocal)) {
        alumnosRecientes.set(idAlumno, ahora);
        mostrarResultado(false, 'Matrícula VENCIDA (' + alumnoLocal.Fecha_Vencimiento + '). ' + alumnoLocal.Nombre_Completo + ' debe renovar.', alumnoLocal.Nombre_Completo, null, null, miSecuencia);
        return;
      }

      const requestId = idAlumno + '_' + ahora + '_' + Math.random().toString(36).slice(2, 8);
      enProceso.set(idAlumno, { requestId: requestId, intentos: 0 });
      actualizarContadorPendientes();

      mostrarResultado(
        true,
        alumnoLocal.Nombre_Completo + ' — ' + modoActual + ' registrada (' + new Date().toLocaleTimeString('es-PE', { hour: 'numeric', minute: '2-digit' }) + ')',
        alumnoLocal.Nombre_Completo,
        modoActual === 'Entrada' ? '📩 Notificación en camino…' : null,
        null,
        miSecuencia
      );

      enviarRegistroEnSegundoPlano_(idAlumno, modoActual, requestId, alumnoLocal.Nombre_Completo);
      alumnosRecientes.set(idAlumno, ahora);
      enProceso.delete(idAlumno);
      actualizarContadorPendientes();
      return;
    }

    // Alumno no encontrado en la caché local: se espera la respuesta del servidor.
    const requestId = idAlumno + '_' + ahora + '_' + Math.random().toString(36).slice(2, 8);
    const entrada = { requestId: requestId, intentos: 0, seq: miSecuencia };
    enProceso.set(idAlumno, entrada);
    actualizarContadorPendientes();

    colaEspera.push({ idAlumno: idAlumno, entrada: entrada });
    procesarCola();
  }

  function enviarRegistroEnSegundoPlano_(idAlumno, tipoMovimiento, requestId, nombreAlumno, intentoActual) {
    intentoActual = (intentoActual || 0) + 1;

    const url =
      URL_ENVIO +
      '?accion=marcarAsistencia' +
      '&idAlumno=' + encodeURIComponent(idAlumno) +
      '&tipoMovimiento=' + encodeURIComponent(tipoMovimiento) +
      '&requestId=' + encodeURIComponent(requestId);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(url, { signal: controller.signal })
      .then(response => {
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(data => {
        const esErrorDeCandado = !data.success && data.message && /tiempo de espera|bloqueo/i.test(data.message);

        if (esErrorDeCandado && intentoActual < MAX_INTENTOS) {
          return enviarRegistroEnSegundoPlano_(idAlumno, tipoMovimiento, requestId, nombreAlumno, intentoActual);
        }

        if (!data.success && esRechazoDeNegocio_(data)) {
          mostrarAlertaCorreccion_(nombreAlumno || idAlumno, data.message);
        }
      })
      .catch(err => {
        clearTimeout(timeoutId);
        if (intentoActual < MAX_INTENTOS) {
          return enviarRegistroEnSegundoPlano_(idAlumno, tipoMovimiento, requestId, nombreAlumno, intentoActual);
        }
        agregarAColaPendiente_({
          idAlumno: idAlumno,
          tipoMovimiento: tipoMovimiento,
          requestId: requestId,
          nombreAlumno: nombreAlumno,
          creadoEn: Date.now(),
          intentos: 0
        });
      });
  }

  // ============================================================
  // COLA DE CONCURRENCIA LIMITADA
  // ============================================================
  function procesarCola() {
    while (solicitudesActivas < MAX_CONCURRENCIA && colaEspera.length > 0) {
      const item = colaEspera.shift();
      solicitudesActivas++;

      ejecutarConReintentos(item.idAlumno, item.entrada)
        .then(() => { finalizarSolicitud(item.idAlumno, item.entrada); })
        .finally(() => {
          solicitudesActivas--;
          procesarCola();
        });
    }
  }

  function finalizarSolicitud(idAlumno, entrada) {
    if (enProceso.get(idAlumno) === entrada) {
      enProceso.delete(idAlumno);
    }
    alumnosRecientes.set(idAlumno, Date.now());
    actualizarContadorPendientes();
    actualizarEstadoSiVigente_('Apunta la cámara al código QR…', entrada.seq);
  }

  // ============================================================
  // ENVÍO CON REINTENTOS CLASIFICADOS
  // ============================================================
  function ejecutarConReintentos(idAlumno, entrada) {

    entrada.intentos++;
    actualizarEstadoSiVigente_('Enviando ' + modoActual + '…', entrada.seq);

    const url =
      URL_ENVIO +
      '?accion=marcarAsistencia' +
      '&idAlumno=' + encodeURIComponent(idAlumno) +
      '&tipoMovimiento=' + encodeURIComponent(modoActual) +
      '&requestId=' + encodeURIComponent(entrada.requestId);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);
    const tEnvioFetch = Date.now();

    return fetch(url, { signal: controller.signal })

      .then(response => {
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })

      .then(data => {
        const esErrorDeCandado = !data.success && data.message && /tiempo de espera|bloqueo/i.test(data.message);

        if (esErrorDeCandado && entrada.intentos < MAX_INTENTOS) {
          actualizarEstadoSiVigente_('Reintentando ' + idAlumno + '…', entrada.seq);
          return ejecutarConReintentos(idAlumno, entrada);
        }

        const diag = Object.assign({}, data.diagnosticoTiempos || {});
        diag.fetchIdaYVuelta_ms = Date.now() - tEnvioFetch;

        mostrarResultado(
          !!data.success,
          data.message || 'Registro procesado.',
          data.alumno ? data.alumno.Nombre_Completo : null,
          data.smsEstado || null,
          diag,
          entrada.seq
        );
      })

      .catch(err => {
        clearTimeout(timeoutId);
        const fueTimeout = err && err.name === 'AbortError';

        if (entrada.intentos < MAX_INTENTOS) {
          actualizarEstadoSiVigente_('Reintentando ' + idAlumno + '…', entrada.seq);
          return ejecutarConReintentos(idAlumno, entrada);
        }

        mostrarResultado(
          false,
          fueTimeout
            ? 'El servidor tardó demasiado en responder. Intenta escanear de nuevo.'
            : 'No se pudo conectar con el servidor: ' + err.message,
          null, null, null,
          entrada.seq
        );
      });
  }

  // ============================================================
  // INICIALIZACIÓN
  // ============================================================
  cargarCacheAlumnosDeStorage_();      // carga la copia guardada en el celular
  refrescarCacheSiCaduco_();           // solo descarga si no existe o tiene más de 3 horas
  actualizarInfoCache_();
  setInterval(actualizarInfoCache_, 60000); // solo actualiza el texto "hace X min" (sin red)

  actualizarContadorPendientes();
  setInterval(procesarColaPendientePersistente, INTERVALO_REINTENTO_COLA_MS);

  // ============================================================
  // INICIAR LECTOR QR
  // ============================================================
  if (typeof Html5Qrcode === 'undefined') {

    estadoDiv.innerHTML =
      '<div class="resultado error">No se pudo cargar la librería del lector QR. Revisa tu conexión a internet.</div>';

  } else if (!window.isSecureContext) {

    estadoDiv.innerHTML =
      '<div class="resultado error">Esta página debe abrirse por HTTPS para poder usar la cámara.</div>';

  } else {

    Html5Qrcode.getCameras()
      .then(camaras => {

        if (!camaras || camaras.length === 0) {
          estadoDiv.innerHTML = '<div class="resultado error">No se detectó ninguna cámara conectada.</div>';
          return;
        }

        const trasera = camaras.find(c => /back|trasera|rear|environment/i.test(c.label || ''));
        const elegida = trasera || camaras[0];
        camaraDeviceId = elegida.id;

        // Solo códigos QR: no prueba otros formatos de barras (menos CPU).
        const scanner = new Html5Qrcode('qr-reader', {
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
          verbose: false
        });
        scannerRef = scanner;

        scanner.start(
          { facingMode: 'environment' }, // cámara trasera, sin depender del nombre de la cámara
          CONFIG_QR,

          decodedText => {
            marcarAsistencia(decodedText);

            // Pausa breve de decodificación para no releer el mismo QR de inmediato.
            if (scannerRef && camaraActiva && !pausadoPorCooldown) {
              pausadoPorCooldown = true;
              try { scannerRef.pause(true); } catch (e) {}
              setTimeout(() => {
                pausadoPorCooldown = false;
                if (scannerRef && camaraActiva && !document.hidden) {
                  try { scannerRef.resume(); } catch (e) {}
                }
              }, PAUSA_CAMARA_MS);
            }
          },

          () => {}
        )
        .then(() => {
          camaraActiva = true;
          estadoDiv.textContent = 'Apunta la cámara al código QR…';
        })
        .catch(err => {
          const nombre = (err && err.name) || String(err);
          let ayuda = 'No se pudo acceder a la cámara (' + nombre + ').';

          if (nombre.indexOf('NotAllowed') > -1) {
            ayuda += ' Revisa el permiso de cámara para este sitio en tu navegador.';
          } else if (nombre.indexOf('NotReadable') > -1) {
            ayuda += ' La cámara está siendo usada por otra aplicación.';
          }

          estadoDiv.innerHTML = '<div class="resultado error">' + ayuda + '</div>';
        });
      })
      .catch(err => {
        estadoDiv.innerHTML =
          '<div class="resultado error">No se pudo listar las cámaras: ' + ((err && err.message) || err) + '</div>';
      });
  }

  // ============================================================
  // SERVICE WORKER
  // ============================================================
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* el lector sigue funcionando sin él */ });
  }

</script>
